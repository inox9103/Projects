<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Calculator Suite</title>
    <style>
        /* Base reset & typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main Card Container */
        .calculator-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 28px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 22px;
            color: #0f172a;
            font-weight: 700;
        }

        header p {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }

        /* Dropdown Selection */
        .select-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            background-color: #ffffff;
            color: #1e293b;
            transition: border-color 0.2s;
        }

        select:focus, input:focus {
            border-color: #2563eb;
        }

        /* Calculator Sections */
        .calc-panel {
            display: none;
        }

        .calc-panel.active {
            display: block;
        }

        .input-field {
            margin-bottom: 16px;
        }

        /* Calculate Button */
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        /* Output Box */
        .result-box {
            margin-top: 20px;
            padding: 14px;
            background-color: #f1f5f9;
            border-radius: 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            border-left: 4px solid #2563eb;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <header>
        <h1>Smart Calculator</h1>
        <p>Select a tool from the menu below</p>
    </header>

    <!-- Tool Selector -->
    <div class="select-group">
        <label for="calculatorType">Choose Calculator</label>
        <select id="calculatorType" onchange="switchCalculator()">
            <option value="basic">Basic Calculator</option>
            <option value="age">Age Calculator</option>
            <option value="bmi">BMI Calculator</option>
            <option value="emi">Loan EMI Calculator</option>
            <option value="percentage">Percentage Calculator</option>
            <option value="discount">Discount Calculator</option>
        </select>
    </div>

    <!-- 1. Basic Calculator -->
    <div id="basic" class="calc-panel active">
        <div class="input-field">
            <input type="number" id="basicNum1" placeholder="First Number">
        </div>
        <div class="input-field">
            <select id="basicOp">
                <option value="+">Addition (+)</option>
                <option value="-">Subtraction (-)</option>
                <option value="*">Multiplication (?)</option>
                <option value="/">Division (?)</option>
            </select>
        </div>
        <div class="input-field">
            <input type="number" id="basicNum2" placeholder="Second Number">
        </div>
        <button onclick="calculateBasic()">Calculate</button>
        <div class="result-box" id="resBasic">Result will appear here</div>
    </div>

    <!-- 2. Age Calculator -->
    <div id="age" class="calc-panel">
        <div class="input-field">
            <label>Date of Birth</label>
            <input type="date" id="dob">
        </div>
        <button onclick="calculateAge()">Calculate Age</button>
        <div class="result-box" id="resAge">Result will appear here</div>
    </div>

    <!-- 3. BMI Calculator -->
    <div id="bmi" class="calc-panel">
        <div class="input-field">
            <input type="number" id="weight" placeholder="Weight in kg (e.g., 70)">
        </div>
        <div class="input-field">
            <input type="number" id="height" placeholder="Height in cm (e.g., 175)">
        </div>
        <button onclick="calculateBMI()">Calculate BMI</button>
        <div class="result-box" id="resBMI">Result will appear here</div>
    </div>

    <!-- 4. EMI Calculator -->
    <div id="emi" class="calc-panel">
        <div class="input-field">
            <input type="number" id="loanAmount" placeholder="Loan Amount ($ or ?)">
        </div>
        <div class="input-field">
            <input type="number" id="interestRate" placeholder="Annual Interest Rate (%)">
        </div>
        <div class="input-field">
            <input type="number" id="tenure" placeholder="Tenure in Months">
        </div>
        <button onclick="calculateEMI()">Calculate Monthly EMI</button>
        <div class="result-box" id="resEMI">Result will appear here</div>
    </div>

    <!-- 5. Percentage Calculator -->
    <div id="percentage" class="calc-panel">
        <div class="input-field">
            <input type="number" id="percentVal" placeholder="Percentage (%)">
        </div>
        <div class="input-field">
            <input type="number" id="totalVal" placeholder="Total Value">
        </div>
        <button onclick="calculatePercentage()">Calculate Value</button>
        <div class="result-box" id="resPercentage">Result will appear here</div>
    </div>

    <!-- 6. Discount Calculator -->
    <div id="discount" class="calc-panel">
        <div class="input-field">
            <input type="number" id="originalPrice" placeholder="Original Price">
        </div>
        <div class="input-field">
            <input type="number" id="discountPercent" placeholder="Discount Percentage (%)">
        </div>
        <button onclick="calculateDiscount()">Calculate Final Price</button>
        <div class="result-box" id="resDiscount">Result will appear here</div>
    </div>
</div>

<script>
    // Tab switcher logic
    function switchCalculator() {
        const selected = document.getElementById('calculatorType').value;
        const panels = document.querySelectorAll('.calc-panel');
        panels.forEach(panel => panel.classList.remove('active'));
        document.getElementById(selected).classList.add('active');
    }

    // Basic Calculator logic
    function calculateBasic() {
        const num1 = parseFloat(document.getElementById('basicNum1').value);
        const num2 = parseFloat(document.getElementById('basicNum2').value);
        const op = document.getElementById('basicOp').value;
        let res = 0;

        if (isNaN(num1) || isNaN(num2)) {
            document.getElementById('resBasic').innerText = "Please enter valid numbers";
            return;
        }

        if (op === '+') res = num1 + num2;
        else if (op === '-') res = num1 - num2;
        else if (op === '*') res = num1 * num2;
        else if (op === '/') res = num2 !== 0 ? num1 / num2 : "Cannot divide by zero";

        document.getElementById('resBasic').innerText = `Result: ${res}`;
    }

    // Age Calculator logic
    function calculateAge() {
        const dobInput = document.getElementById('dob').value;
        if (!dobInput) {
            document.getElementById('resAge').innerText = "Please select a date";
            return;
        }

        const dob = new Date(dobInput);
        const today = new Date();

        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();

        if (days < 0) {
            months--;
            days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById('resAge').innerText = `You are ${years} years, ${months} months, and ${days} days old`;
    }

    // BMI Calculator logic
    function calculateBMI() {
        const weight = parseFloat(document.getElementById('weight').value);
        const heightCm = parseFloat(document.getElementById('height').value);

        if (!weight || !heightCm) {
            document.getElementById('resBMI').innerText = "Please fill in all fields";
            return;
        }

        const heightM = heightCm / 100;
        const bmi = (weight / (heightM * heightM)).toFixed(1);
        let category = "";

        if (bmi < 18.5) category = "Underweight";
        else if (bmi < 24.9) category = "Normal weight";
        else if (bmi < 29.9) category = "Overweight";
        else category = "Obesity";

        document.getElementById('resBMI').innerText = `BMI: ${bmi} (${category})`;
    }

    // EMI Calculator logic
    function calculateEMI() {
        const p = parseFloat(document.getElementById('loanAmount').value);
        const rAnnual = parseFloat(document.getElementById('interestRate').value);
        const n = parseFloat(document.getElementById('tenure').value);

        if (!p || !rAnnual || !n) {
            document.getElementById('resEMI').innerText = "Please fill in all fields";
            return;
        }

        const r = (rAnnual / 12) / 100;
        const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);

        document.getElementById('resEMI').innerText = `Monthly EMI: $${emi.toFixed(2)}`;
    }

    // Percentage Calculator logic
    function calculatePercentage() {
        const pct = parseFloat(document.getElementById('percentVal').value);
        const total = parseFloat(document.getElementById('totalVal').value);

        if (isNaN(pct) || isNaN(total)) {
            document.getElementById('resPercentage').innerText = "Please enter valid numbers";
            return;
        }

        const result = (pct / 100) * total;
        document.getElementById('resPercentage').innerText = `${pct}% of ${total} = ${result}`;
    }

    // Discount Calculator logic
    function calculateDiscount() {
        const price = parseFloat(document.getElementById('originalPrice').value);
        const discount = parseFloat(document.getElementById('discountPercent').value);

        if (isNaN(price) || isNaN(discount)) {
            document.getElementById('resDiscount').innerText = "Please enter valid numbers";
            return;
        }

        const saved = (price * discount) / 100;
        const finalPrice = price - saved;

        document.getElementById('resDiscount').innerText = `Final Price: $${finalPrice.toFixed(2)} (You save $${saved.toFixed(2)})`;
    }
</script>

</body>
</html>
