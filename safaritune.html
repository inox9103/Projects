<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Free Audio Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        h2 { color: #1db954; text-align: center; margin-bottom: 20px; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; }
        button { padding: 12px 20px; background: #1db954; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 12px; }
        .title { font-weight: bold; margin-bottom: 8px; display: block; }
        audio { width: 100%; margin-top: 8px; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 8px 12px; background: #333; color: #1db954; text-decoration: none; border-radius: 4px; font-size: 0.85rem; border: 1px solid #1db954; }
    </style>
</head>
<body>

<div class="container">
    <h2>Free Audio Search</h2>
    <div class="search-box">
        <input type="text" id="query" placeholder="Type music style (e.g. synth, chill, drum)..." value="chill">
        <button onclick="searchAudio()">Search</button>
    </div>
    <div id="results"></div>
</div>

<script>
async function searchAudio() {
    const query = document.getElementById('query').value.trim();
    const resultsDiv = document.getElementById('results');
    if (!query) return;

    resultsDiv.innerHTML = '<p style="text-align:center;">Searching live audio...</p>';

    try {
        // Freesound public search API endpoint
        const response = await fetch(`https://freesound.org/apiv2/search/text/?query=${encodeURIComponent(query)}&fields=id,name,previews,username&token=BMY8O4mR8I0F8VbL0GgP4O3N5A6B7C8D`);
        const data = await response.json();

        resultsDiv.innerHTML = '';

        if (!data.results || data.results.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align:center;">No audio found. Try keywords like "beat", "piano", "synth", "guitar".</p>';
            return;
        }

        data.results.forEach(track => {
            const streamUrl = track.previews['preview-hq-mp3'];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="title">${track.name}</span>
                <span style="color:#aaa; font-size:0.8rem;">By ${track.username}</span>
                <audio controls src="${streamUrl}"></audio>
                <a class="download-btn" href="${streamUrl}" download="${track.name}.mp3" target="_blank">Download MP3</a>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (err) {
        resultsDiv.innerHTML = '<p style="text-align:center; color:red;">Connection error. Please try again.</p>';
    }
}

searchAudio();
</script>

</body>
</html>
