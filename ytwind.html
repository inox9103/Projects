<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ytwind - YouTube Video Downloader</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ff0033',
                            600: '#cc0029',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 py-4 px-6">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-brand-500 text-white p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-wind text-xl"></i>
                </div>
                <span class="text-2xl font-extrabold tracking-tight">yt<span class="text-brand-500">wind</span></span>
            </div>
            <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">v3.0 Cobalt Engine</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-12 max-w-3xl flex-grow flex flex-col justify-center">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-black mb-3 bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                YouTube Video Download Karein
            </h1>
            <p class="text-slate-400 text-sm md:text-base">
                Direct Video aur Audio Download Links - No Ads, No Error.
            </p>
        </div>

        <!-- Downloader Box -->
        <div class="bg-slate-900/90 p-6 md:p-8 rounded-3xl border border-slate-800 shadow-2xl backdrop-blur-xl">
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="relative flex-grow">
                    <i class="fa-brands fa-youtube absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg"></i>
                    <input 
                        type="text" 
                        id="videoUrl" 
                        placeholder="Yahan YouTube link paste karein..." 
                        class="w-full pl-11 pr-4 py-4 bg-slate-950 border border-slate-800 rounded-2xl focus:outline-none focus:border-brand-500 text-white placeholder-slate-500 transition-all text-sm md:text-base"
                    >
                </div>
                <button 
                    onclick="downloadMedia('tunnel')" 
                    id="btnGet"
                    class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white font-bold px-8 py-4 rounded-2xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-brand-500/20 cursor-pointer">
                    <span>Download MP4</span>
                    <i class="fa-solid fa-arrow-down"></i>
                </button>
            </div>

            <!-- Quality & Mode Selection -->
            <div class="flex flex-wrap gap-4 mt-4 justify-between items-center text-xs text-slate-400 border-t border-slate-800/80 pt-4">
                <div class="flex items-center gap-2">
                    <label>Quality:</label>
                    <select id="videoQuality" class="bg-slate-950 border border-slate-800 text-slate-200 rounded-lg px-2.5 py-1.5 focus:outline-none">
                        <option value="1080">1080p Full HD</option>
                        <option value="720" selected>720p HD</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>
                    </select>
                </div>
                <button onclick="downloadMedia('audio')" class="text-brand-500 hover:underline flex items-center gap-1 font-semibold">
                    <i class="fa-solid fa-music"></i> Audio Only (MP3) Download
                </button>
            </div>

            <!-- Loader -->
            <div id="loader" class="hidden text-center my-8">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-brand-500 border-t-transparent"></div>
                <p class="text-slate-400 text-sm mt-3 animate-pulse">Download link generate ho raha hai...</p>
            </div>

            <!-- Error Box -->
            <div id="errorMsg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-2xl mt-6 text-center text-sm"></div>

            <!-- Success Download Link Box -->
            <div id="resultContainer" class="hidden mt-6 bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                <p class="text-green-400 font-medium text-sm mb-3">Download Link Ready!</p>
                <a id="downloadBtnLink" href="#" target="_blank" class="inline-flex items-center justify-center gap-2 bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3 rounded-xl transition text-sm">
                    <i class="fa-solid fa-download"></i> Direct File Save Karein
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-slate-500 text-xs">
        <p>&copy; <strong class="text-slate-400">ytwind</strong>. Powered by Cobalt Engine.</p>
    </footer>

    <!-- JavaScript -->
    <script>
        async function downloadMedia(type) {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const quality = document.getElementById('videoQuality').value;
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const resultContainer = document.getElementById('resultContainer');
            const downloadBtnLink = document.getElementById('downloadBtnLink');

            errorMsg.classList.add('hidden');
            resultContainer.classList.add('hidden');

            if (!urlInput) {
                showError("Kripya YouTube video link paste karein!");
                return;
            }

            loader.classList.remove('hidden');

            try {
                // Official Cobalt API Request Payload
                const payload = {
                    url: urlInput,
                    vQuality: quality,
                    isAudioOnly: type === 'audio',
                    downloadMode: 'tunnel'
                };

                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.status === 'tunnel' || data.status === 'redirect') {
                    downloadBtnLink.href = data.url;
                    resultContainer.classList.remove('hidden');
                    // Automatically trigger download/redirect
                    window.open(data.url, '_blank');
                } else if (data.status === 'picker') {
                    downloadBtnLink.href = data.picker[0].url;
                    resultContainer.classList.remove('hidden');
                } else {
                    showError(data.text || "Video process nahi ho saki. Dusra link try karein.");
                }

            } catch (err) {
                showError("Server Connection Failure! network check karein ya thodi der baad try karein.");
            } finally {
                loader.classList.add('hidden');
            }
        }

        function showError(msg) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }
    </script>
</body>
</html>
