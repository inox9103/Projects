<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer and Compressor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 15px;
            padding: 0;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 15px;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 5px;
        }

        .box {
            border: 1px dashed #666;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }

        .field {
            margin-bottom: 10px;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 3px;
        }

        input, select, button {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            margin-top: 2px;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        .loading {
            display: none;
            font-weight: bold;
            color: #d9534f;
            margin: 10px 0;
        }

        .result {
            display: none;
            margin-top: 15px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .download-btn {
            background-color: #007bff;
            color: white;
            text-decoration: none;
            display: block;
            padding: 8px;
            font-weight: bold;
            border-radius: 3px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Image Resizer & Compressor</h2>
    <p>Resize and compress images to your required KB or MB easily.</p>

    <div class="container">
        <!-- Step 1: Upload File -->
        <div class="box">
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- Step 2: Custom Controls -->
        <div id="controls" style="display: none;">
            <div class="field">
                <p><strong>Original Size:</strong> <span id="originalSize">0 KB</span></p>
                <p><strong>Original Dimensions:</strong> <span id="originalDims">0 x 0 px</span></p>
            </div>

            <div class="field">
                <label for="targetSize">Target File Size:</label>
                <input type="number" id="targetSize" placeholder="Enter target size (e.g. 50)">
                <select id="sizeUnit">
                    <option value="KB">KB</option>
                    <option value="MB">MB</option>
                </select>
            </div>

            <div class="field">
                <label><input type="checkbox" id="keepRatio" checked onchange="toggleRatioOptions()"> Keep Aspect Ratio</label>
            </div>

            <div class="field">
                <label for="customWidth">Width (px) [Optional]:</label>
                <input type="number" id="customWidth" placeholder="Leave blank for auto">
            </div>

            <div class="field">
                <label for="customHeight">Height (px) [Optional]:</label>
                <input type="number" id="customHeight" placeholder="Leave blank for auto" disabled>
            </div>

            <button onclick="startCompression()">Compress / Resize Image</button>
        </div>

        <!-- Loading Message -->
        <div class="loading" id="loadingText">
            Compressing image... Please wait...
        </div>

        <!-- Step 3: Result Preview & Download -->
        <div class="result" id="resultBox">
            <h3>Compressed Result</h3>
            <img id="outputImage" src="" alt="Resized Image">
            <p><strong>New File Size:</strong> <span id="newSize">0 KB</span></p>
            <p><strong>New Dimensions:</strong> <span id="newDims">0 x 0 px</span></p>
            <a id="downloadBtn" class="download-btn" download="resized-image.jpg">Download Image</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const controls = document.getElementById('controls');
        const originalSizeTag = document.getElementById('originalSize');
        const originalDimsTag = document.getElementById('originalDims');

        const keepRatioCheckbox = document.getElementById('keepRatio');
        const customWidthInput = document.getElementById('customWidth');
        const customHeightInput = document.getElementById('customHeight');

        const loadingText = document.getElementById('loadingText');
        const resultBox = document.getElementById('resultBox');
        const outputImage = document.getElementById('outputImage');
        const newSizeTag = document.getElementById('newSize');
        const newDimsTag = document.getElementById('newDims');
        const downloadBtn = document.getElementById('downloadBtn');

        let loadedImage = new Image();
        let originalFile = null;

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            originalSizeTag.innerText = formatBytes(file.size);

            const reader = new FileReader();
            reader.onload = function(event) {
                loadedImage.onload = function() {
                    originalDimsTag.innerText = loadedImage.width + ' x ' + loadedImage.height + ' px';
                    customWidthInput.value = loadedImage.width;
                    customHeightInput.value = loadedImage.height;
                    controls.style.display = 'block';
                    resultBox.style.display = 'none';
                };
                loadedImage.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function toggleRatioOptions() {
            if (keepRatioCheckbox.checked) {
                customHeightInput.disabled = true;
                if (customWidthInput.value) {
                    const ratio = loadedImage.height / loadedImage.width;
                    customHeightInput.value = Math.round(customWidthInput.value * ratio);
                }
            } else {
                customHeightInput.disabled = false;
            }
        }

        customWidthInput.addEventListener('input', function() {
            if (keepRatioCheckbox.checked && loadedImage.width) {
                const ratio = loadedImage.height / loadedImage.width;
                customHeightInput.value = Math.round(customWidthInput.value * ratio);
            }
        });

        function startCompression() {
            loadingText.style.display = 'block';
            resultBox.style.display = 'none';

            setTimeout(processImage, 100);
        }

        function processImage() {
            const targetVal = parseFloat(document.getElementById('targetSize').value);
            const unit = document.getElementById('sizeUnit').value;

            let targetBytes = targetVal ? (unit === 'KB' ? targetVal * 1024 : targetVal * 1024 * 1024) : Infinity;

            let targetWidth = parseInt(customWidthInput.value) || loadedImage.width;
            let targetHeight = parseInt(customHeightInput.value) || loadedImage.height;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            canvas.width = targetWidth;
            canvas.height = targetHeight;

            let quality = 0.95;
            let dataUrl = '';
            let currentSize = Infinity;
            let scale = 1.0;

            for (let i = 0; i < 30; i++) {
                let curW = Math.max(1, Math.floor(targetWidth * scale));
                let curH = Math.max(1, Math.floor(targetHeight * scale));

                canvas.width = curW;
                canvas.height = curH;

                ctx.clearRect(0, 0, curW, curH);
                ctx.drawImage(loadedImage, 0, 0, curW, curH);

                dataUrl = canvas.toDataURL('image/jpeg', quality);
                currentSize = Math.round((dataUrl.length - 'data:image/jpeg;base64,'.length) * 3 / 4);

                if (currentSize <= targetBytes || (quality <= 0.1 && scale <= 0.2)) {
                    break;
                }

                if (quality > 0.15) {
                    quality -= 0.08;
                } else {
                    scale *= 0.85;
                }
            }

            outputImage.src = dataUrl;
            newSizeTag.innerText = formatBytes(currentSize);
            newDimsTag.innerText = canvas.width + ' x ' + canvas.height + ' px';
            downloadBtn.href = dataUrl;

            loadingText.style.display = 'none';
            resultBox.style.display = 'block';
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return bytes + ' Bytes';
            else if (bytes < 1048576) return (bytes / 1024).toFixed(2) + ' KB';
            else return (bytes / 1048576).toFixed(2) + ' MB';
        }
    </script>
</body>
</html>
